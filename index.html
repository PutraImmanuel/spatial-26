<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard & Statistik Poin Lomba</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* Custom horizontal scrollbar */
        .table-scroll::-webkit-scrollbar {
            height: 8px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Sticky positioning for table columns */
        .sticky-col-1 {
            position: sticky;
            left: 0;
            z-index: 20;
        }
        .sticky-col-2 {
            position: sticky;
            left: 56px; /* Lebar kolom Pos */
            z-index: 20;
        }
        .sticky-header {
            z-index: 30 !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6 antialiased">

    <div class="max-w-7xl mx-auto space-y-5">
        
        <!-- Main Header Banner with LOGO SPATIAL NEW.png -->
        <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-5 bg-slate-900 border border-slate-800 p-5 sm:p-6 rounded-2xl shadow-2xl relative overflow-hidden">
            
            <!-- Background Glow Effect -->
            <div class="absolute -top-12 -left-12 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex items-center gap-4 sm:gap-5 z-10">
                <!-- Logo SPATIAL Image Direct -->
                <div class="flex-shrink-0 flex items-center justify-center p-1 bg-slate-950/60 rounded-2xl border border-slate-800 shadow-md">
                    <img 
                        src="LOGO SPATIAL NEW.png" 
                        alt="Logo SPATIAL" 
                        class="h-14 sm:h-16 w-auto object-contain drop-shadow transition-transform duration-300 hover:scale-105" 
                    />
                </div>

                <!-- Titles & Subtitle -->
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] uppercase tracking-widest font-extrabold px-2.5 py-0.5 rounded-full">
                            SPATIAL
                        </span>
                        <span class="text-xs text-slate-500 font-medium">Official Leaderboard</span>
                    </div>
                    <h1 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-white tracking-tight">
                        Leaderboard & Poin
                </div>
            </div>

            <!-- Top Summary Badges & Export Button -->
            <div class="flex flex-wrap items-center gap-3 z-10 w-full md:w-auto justify-start md:justify-end">
                <div class="bg-slate-950/80 border border-slate-800 px-4 py-2 rounded-xl text-center flex-1 sm:flex-none">
                    <div class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Total Gugus</div>
                    <div id="statTotalTeams" class="text-base font-extrabold text-amber-400">0</div>
                </div>
                <div class="bg-slate-950/80 border border-slate-800 px-4 py-2 rounded-xl text-center flex-1 sm:flex-none">
                    <div class="text-[10px] uppercase font-bold text-slate-500 tracking-wider">Cabang Lomba</div>
                    <div id="statTotalCats" class="text-base font-extrabold text-amber-400">0</div>
                </div>
                
                <!-- Export CSV Button -->
                <button onclick="exportToCSV()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-3.5 py-2.5 rounded-xl border border-indigo-400/30 flex items-center gap-2 transition-all shadow-lg shadow-indigo-600/20 active:scale-95">
                    <i class="fa-solid fa-file-csv text-sm"></i>
                    <span>Export CSV</span>
                </button>
            </div>
        </div>

        <!-- Filter & Search Toolbar -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <!-- Search Box -->
            <div class="relative flex-1 max-w-md">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input 
                    type="text" 
                    id="searchInput" 
                    oninput="renderLeaderboard()" 
                    placeholder="Cari nama gugus..." 
                    class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl pl-9 pr-3 py-2.5 focus:outline-none focus:border-amber-500/60 transition-colors"
                >
            </div>

            <!-- Top Leader Highlight -->
            <div class="flex items-center gap-2.5 bg-amber-500/10 border border-amber-500/20 px-4 py-2 rounded-xl text-xs">
                <span class="text-amber-400 font-bold flex items-center gap-1">
                    <i class="fa-solid fa-crown text-amber-400"></i> Pemimpin Klasemen:
                </span>
                <span id="statTopTeam" class="font-black text-white text-sm">-</span>
            </div>
        </div>

        <!-- Scrollable Leaderboard Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
            <div class="overflow-x-auto table-scroll">
                <table class="w-full text-left border-collapse min-w-max">
                    <thead>
                        <tr id="tableHeaderRow" class="bg-slate-950 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <!-- Headers rendered dynamically via JS -->
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800/60 text-sm">
                        <!-- Rows rendered dynamically via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="flex flex-col sm:flex-row items-center justify-between text-[11px] text-slate-500 px-1 gap-2">
            <span class="flex items-center gap-1.5">
                <i class="fa-solid fa-lock text-slate-600"></i>
                Data diatur langsung via kode JavaScript (Read-Only untuk pengunjung web).
            </span>
            <span>Geser tabel ke kanan untuk melihat cabang lomba lainnya.</span>
        </div>

    </div>

    <script>
        // =========================================================================
        // KONFIGURASI DATA LOMBA & POIN (EDIT DATA DI SINI)
        // =========================================================================
        const CONFIG_LOMBA = {
            // 1. DAFTAR CABANG LOMBA (1 Lomba = 1 Kolom Tersendiri)
            categories: [
                { id: 'lomba1', name: 'Lomba 1' },
                { id: 'lomba2', name: 'Lomba 2' },
                { id: 'lomba3', name: 'Lomba 3' },
                { id: 'lomba4', name: 'Lomba 4' }
            ],

            // 2. DAFTAR GUGUS BESERTA POIN MASING-MASING LOMBA (Default 0)
            teams: [
                {
                    name: 'Gugus 1',
                    scores: {
                        lomba1: 0,
                        lomba2: 0,
                        lomba3: 0,
                        lomba4: 0
                    }
                },
                {
                    name: 'Gugus 2',
                    scores: {
                        lomba1: 0,
                        lomba2: 0,
                        lomba3: 0,
                        lomba4: 0
                    }
                },
                {
                    name: 'Gugus 3',
                    scores: {
                        lomba1: 0,
                        lomba2: 0,
                        lomba3: 0,
                        lomba4: 0
                    }
                },
                {
                    name: 'Gugus 4',
                    scores: {
                        lomba1: 0,
                        lomba2: 0,
                        lomba3: 0,
                        lomba4: 0
                    }
                }
            ]
        };

        // =========================================================================
        // LOGIKA PENJUMALAHAN, PENGURUTAN, RENDER TABEL & EXPORT
        // =========================================================================

        function processAndSortData() {
            const processedTeams = CONFIG_LOMBA.teams.map(team => {
                let total = 0;
                CONFIG_LOMBA.categories.forEach(cat => {
                    const score = parseFloat(team.scores[cat.id]);
                    total += isNaN(score) ? 0 : score;
                });
                return {
                    ...team,
                    totalScore: parseFloat(total.toFixed(2))
                };
            });

            // Urutkan dari total poin tertinggi ke terendah
            processedTeams.sort((a, b) => b.totalScore - a.totalScore);
            return processedTeams;
        }

        function renderLeaderboard() {
            const sortedTeams = processAndSortData();
            const searchQuery = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            const filteredTeams = sortedTeams.filter(t => t.name.toLowerCase().includes(searchQuery));

            // Update Statistik Ringkasan Header
            document.getElementById('statTotalTeams').innerText = CONFIG_LOMBA.teams.length;
            document.getElementById('statTotalCats').innerText = CONFIG_LOMBA.categories.length;
            document.getElementById('statTopTeam').innerText = sortedTeams.length > 0 ? sortedTeams[0].name : '-';

            // 1. Render Header Tabel
            const headerRow = document.getElementById('tableHeaderRow');
            let headerHTML = `
                <th class="py-4 px-3 text-center w-14 sticky-col-1 sticky-header bg-slate-950 border-r border-slate-800 font-bold">Pos</th>
                <th class="py-4 px-4 min-w-[180px] sticky-col-2 sticky-header bg-slate-950 border-r border-slate-800 font-bold">Nama Gugus</th>
            `;

            // Kolom Cabang Lomba
            CONFIG_LOMBA.categories.forEach(cat => {
                headerHTML += `
                    <th class="py-4 px-4 border-r border-slate-800 text-center min-w-[140px] font-bold text-slate-300">
                        ${escapeHtml(cat.name)}
                    </th>
                `;
            });

            // Kolom Total Poin
            headerHTML += `
                <th class="py-4 px-4 text-right min-w-[140px] bg-indigo-950/60 text-indigo-300 font-extrabold border-l border-slate-800">Total Poin</th>
            `;

            headerRow.innerHTML = headerHTML;

            // 2. Render Baris Gugus
            const tbody = document.getElementById('tableBody');

            if (filteredTeams.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="${CONFIG_LOMBA.categories.length + 3}" class="text-center py-10 text-slate-500 text-xs">
                            Tidak ada gugus yang cocok dengan pencarian.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filteredTeams.map((team) => {
                const rankIndex = sortedTeams.findIndex(t => t.name === team.name) + 1;

                let rankBadge = `<span class="text-slate-400 font-bold text-xs">#${rankIndex}</span>`;
                let rowBgClass = "bg-slate-900/40 hover:bg-slate-800/40";
                let stickyBgClass = "bg-slate-900";

                if (rankIndex === 1) {
                    rankBadge = `<span class="text-xl inline-block drop-shadow" title="Juara 1">🥇</span>`;
                    rowBgClass = "bg-amber-500/10 hover:bg-amber-500/15 border-l-4 border-l-amber-400";
                } else if (rankIndex === 2) {
                    rankBadge = `<span class="text-xl inline-block drop-shadow" title="Juara 2">🥈</span>`;
                    rowBgClass = "bg-slate-400/10 hover:bg-slate-400/15 border-l-4 border-l-slate-300";
                } else if (rankIndex === 3) {
                    rankBadge = `<span class="text-xl inline-block drop-shadow" title="Juara 3">🥉</span>`;
                    rowBgClass = "bg-amber-700/10 hover:bg-amber-700/15 border-l-4 border-l-amber-600";
                }

                // Render nilai sel per lomba
                const scoreCells = CONFIG_LOMBA.categories.map(cat => {
                    const val = team.scores[cat.id] !== undefined ? team.scores[cat.id] : 0;
                    return `
                        <td class="py-3.5 px-4 border-r border-slate-800/60 text-center font-semibold text-slate-200">
                            ${val}
                        </td>
                    `;
                }).join('');

                return `
                    <tr class="${rowBgClass} transition-colors">
                        <td class="py-3.5 px-3 text-center font-bold sticky-col-1 ${stickyBgClass} border-r border-slate-800">
                            ${rankBadge}
                        </td>
                        <td class="py-3.5 px-4 font-bold text-slate-100 sticky-col-2 ${stickyBgClass} border-r border-slate-800">
                            ${escapeHtml(team.name)}
                        </td>
                        ${scoreCells}
                        <td class="py-3.5 px-4 text-right font-extrabold text-indigo-300 text-base bg-indigo-950/40 border-l border-slate-800">
                            ${team.totalScore}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Export data ke file CSV
        function exportToCSV() {
            const sortedTeams = processAndSortData();
            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Header CSV
            const headers = ["Pos", "Nama Gugus", ...CONFIG_LOMBA.categories.map(c => `"${c.name}"`), "Total Poin"];
            csvContent += headers.join(",") + "\n";

            // Data Rows CSV
            sortedTeams.forEach((team, idx) => {
                const row = [
                    idx + 1,
                    `"${team.name}"`,
                    ...CONFIG_LOMBA.categories.map(c => team.scores[c.id] || 0),
                    team.totalScore
                ];
                csvContent += row.join(",") + "\n";
            });

            // Trigger Download
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "leaderboard_spatial_lomba.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        window.addEventListener('DOMContentLoaded', renderLeaderboard);
    </script>
</body>
</html>
